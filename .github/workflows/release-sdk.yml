name: Release SDK

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read

concurrency:
  group: release-sdk-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    env:
      PACKAGES_DIR: artifacts/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Tag '$env:GITHUB_REF_NAME' is not a supported SemVer tag. Use v1.2.3 or v1.2.3-preview.1."
          }

          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --verbosity normal

      - name: Pack SDK
        run: dotnet pack src/CloudConfigurationHub.Sdk/CloudConfigurationHub.Sdk.csproj --configuration Release --no-restore --output ${{ env.PACKAGES_DIR }} /p:PackageVersion=${{ steps.version.outputs.value }} /p:ContinuousIntegrationBuild=true /p:RepositoryCommit=${{ github.sha }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudConfigurationHub.Sdk-${{ steps.version.outputs.value }}
          path: |
            ${{ env.PACKAGES_DIR }}/*.nupkg
            ${{ env.PACKAGES_DIR }}/*.snupkg
          if-no-files-found: error

      - name: Publish to NuGet.org
        shell: pwsh
        run: |
          dotnet nuget push "${{ env.PACKAGES_DIR }}/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
